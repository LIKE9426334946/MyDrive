<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fb">
  <meta name="description" content="MyDrive 私人网盘">
  <title>MyDrive · 私人网盘</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login-view" class="login-view" aria-labelledby="login-title">
    <div class="login-decoration login-decoration-one"></div>
    <div class="login-decoration login-decoration-two"></div>
    <main class="login-card">
      <div class="brand-mark brand-mark-large" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M7.5 10.5A4.5 4.5 0 0 1 12 6h8a4.5 4.5 0 0 1 4.5 4.5v11A4.5 4.5 0 0 1 20 26h-8a4.5 4.5 0 0 1-4.5-4.5z"/><path d="M11 14.5h10M11 19h7"/></svg>
      </div>
      <p class="eyebrow">PERSONAL CLOUD</p>
      <h1 id="login-title">欢迎回到 MyDrive</h1>
      <p class="login-subtitle">安全访问你的私人文件空间</p>

      <form id="login-form" class="login-form" novalidate>
        <label for="username">用户名</label>
        <div class="input-shell">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-4 3.2-6 7.5-6s6.7 2 7.5 6"/></svg>
          <input id="username" name="username" autocomplete="username" required placeholder="请输入用户名">
        </div>

        <label for="password">密码</label>
        <div class="input-shell">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码">
          <button id="toggle-password" class="icon-button input-action" type="button" aria-label="显示密码" title="显示密码">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
        <p id="login-error" class="form-error" role="alert"></p>
        <button id="login-button" class="button button-primary button-login" type="submit">
          <span>登录网盘</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </form>
      <p class="session-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 2.8 8 7 10 4.2-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>
        登录状态将在此设备保留 30 天
      </p>
    </main>
  </section>

  <section id="drive-view" class="drive-view" hidden>
    <header class="app-header">
      <a class="brand" href="#" aria-label="返回网盘首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M7.5 10.5A4.5 4.5 0 0 1 12 6h8a4.5 4.5 0 0 1 4.5 4.5v11A4.5 4.5 0 0 1 20 26h-8a4.5 4.5 0 0 1-4.5-4.5z"/><path d="M11 14.5h10M11 19h7"/></svg>
        </span>
        <span><strong>MyDrive</strong><small>私人网盘</small></span>
      </a>

      <div class="search-shell">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search-input" type="search" autocomplete="off" placeholder="搜索所有文件和文件夹" aria-label="搜索文件">
        <button id="clear-search" class="icon-button clear-search" type="button" aria-label="清除搜索" title="清除搜索" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </div>

      <div class="header-account">
        <span id="account-avatar" class="account-avatar">N</span>
        <span id="account-name" class="account-name">noart</span>
        <button id="logout-button" class="icon-button logout-button" type="button" aria-label="退出登录" title="退出登录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"/></svg>
        </button>
      </div>
    </header>

    <main class="drive-main">
      <div class="page-heading">
        <div>
          <p id="page-eyebrow" class="eyebrow">MY FILES</p>
          <h1 id="page-title">我的文件</h1>
        </div>
        <div class="primary-actions">
          <button id="new-folder-button" class="button button-secondary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5h7l2 2h9v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 12v6M9 15h6"/></svg>
            <span>新建文件夹</span>
          </button>
          <button id="upload-button" class="button button-primary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 14v5h14v-5"/></svg>
            <span>上传文件</span>
          </button>
          <input id="file-input" type="file" multiple hidden>
        </div>
      </div>

      <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前路径"></nav>

      <section id="drop-zone" class="file-panel" aria-label="文件列表">
        <div id="drop-overlay" class="drop-overlay" hidden>
          <div class="drop-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 14v5h14v-5"/></svg></div>
          <strong>松开即可上传</strong>
          <span>文件会保存到当前文件夹</span>
        </div>

        <div id="list-header" class="file-list-header">
          <span>名称</span>
          <span>修改时间</span>
          <span>大小</span>
          <span aria-label="操作"></span>
        </div>
        <div id="loading-state" class="loading-state" hidden>
          <span class="spinner"></span><span>正在读取文件…</span>
        </div>
        <div id="file-list" class="file-list"></div>
        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-illustration" aria-hidden="true">
            <svg viewBox="0 0 96 76"><path d="M8 24h31l8 9h41v31a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z"/><path d="M8 30V18a6 6 0 0 1 6-6h23l8 9h37a6 6 0 0 1 6 6v6"/></svg>
          </div>
          <h2 id="empty-title">这里还没有文件</h2>
          <p id="empty-description">拖放文件到这里，或者使用上方的上传按钮</p>
          <button id="empty-upload-button" class="button button-primary" type="button">上传第一个文件</button>
        </div>
      </section>

      <footer class="list-footer">
        <span id="item-count">0 个项目</span>
        <span class="storage-location"><span class="status-dot"></span>文件安全存储在私人服务器</span>
      </footer>
    </main>

    <div id="upload-progress" class="upload-progress" role="status" hidden>
      <div class="upload-progress-header">
        <span><strong id="upload-progress-title">正在上传</strong><small id="upload-progress-detail">准备中…</small></span>
        <strong id="upload-percent">0%</strong>
      </div>
      <div class="progress-track"><span id="progress-bar"></span></div>
    </div>
  </section>

  <dialog id="folder-dialog" class="dialog">
    <form id="folder-form" method="dialog">
      <div class="dialog-icon folder-dialog-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5h7l2 2h9v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 12v6M9 15h6"/></svg></div>
      <div class="dialog-copy">
        <h2>新建文件夹</h2>
        <p>在当前位置创建一个新的文件夹</p>
      </div>
      <label for="folder-name">文件夹名称</label>
      <input id="folder-name" name="folderName" maxlength="255" required autocomplete="off" placeholder="例如：学习资料">
      <p id="folder-error" class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="folder-cancel" class="button button-ghost" type="button">取消</button>
        <button class="button button-primary" type="submit">创建</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" class="dialog">
    <form id="delete-form" method="dialog">
      <div class="dialog-icon danger-dialog-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></div>
      <div class="dialog-copy">
        <h2>确认删除</h2>
        <p id="delete-description">删除后将无法恢复。</p>
      </div>
      <div class="dialog-actions">
        <button id="delete-cancel" class="button button-ghost" type="button">取消</button>
        <button id="delete-confirm" class="button button-danger" type="submit">确认删除</button>
      </div>
    </form>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="/app.js" defer></script>
</body>
</html>
